name: rjdj

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rjdj_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rjdj}
      MYSQL_USER: ${MYSQL_USER:-rjdj}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rjdj_pass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-rjdj}
      DB_PASSWORD: ${MYSQL_PASSWORD:-rjdj_pass}
      DB_NAME: ${MYSQL_DATABASE:-rjdj}
      JWT_SECRET: ${JWT_SECRET:-okx-analytics-change-me-secret-9f2c8d1a7b6e}
      ENCRYPT_KEY: ${ENCRYPT_KEY:-okx-analytics-enc-key-32b-7f3a!@#}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
